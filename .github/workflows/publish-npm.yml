name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish (e.g. v1.0.0-rc.1)
        required: true
        default: v1.0.0-rc.1

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi

          if [ -z "$TAG" ]; then
            echo "No release tag found."
            exit 1
          fi

          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Set package version from release tag
        run: npm version "${{ steps.release.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Resolve npm dist-tag
        id: dist-tag
        run: |
          VERSION="${{ steps.release.outputs.version }}"

          if [[ "$VERSION" =~ -alpha(\.|$) ]]; then
            TAG=alpha
          elif [[ "$VERSION" =~ -rc(\.|$) ]]; then
            TAG=rc
          elif [[ "$VERSION" =~ -beta(\.|$) ]]; then
            TAG=beta
          else
            TAG=latest
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing @deform-wg/deform@$VERSION with dist-tag '$TAG'"

      - name: Build package
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish to npm
        run: npm publish --access public --tag "${{ steps.dist-tag.outputs.tag }}"
