name: Deploy landing and form-builder to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build landing and form-builder sites
        run: |
          npm run landing:build
          npm run form-builder:build

      - name: Assemble Pages site
        run: |
          mkdir -p pages-site/form-builder
          cp -a landing/dist/. pages-site/
          cp -a form-builder/dist/. pages-site/form-builder/
          printf 'deform.now\n' > pages-site/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload built artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
